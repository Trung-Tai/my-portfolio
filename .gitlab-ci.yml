stages:
  - deploy

deploy:
  stage: deploy

  image: alpine:latest

  before_script:
    - apk add --no-cache openssh

    - mkdir -p ~/.ssh

    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519

    - chmod 600 ~/.ssh/id_ed25519

    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

  script:
    - |
      ssh ubuntu@$SERVER_IP "
      cd /home/ubuntu/my-portfolio &&
      git pull &&
      docker compose down &&
      docker compose up -d --build
      "

  only:
    - main